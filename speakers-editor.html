<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#faf6ef">
<title>MiGPT · 信号路由</title>
<style>
  :root {
    --bg: #faf6ef;
    --surface: #ffffff;
    --surface2: #f4efe5;
    --border: #e8e2d5;
    --border-hover: #cec4ae;
    --text: #2d2319;
    --text-dim: #6b5f52;
    --text-faint: #948878;
    --accent: #b55228;
    --accent-dim: #fdf3ec;
    --accent-glow: rgba(181,82,40,0.1);
    --cyan: #3d7d6e;
    --red: #b53d36;
    --red-dim: #fef0ee;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.04);
    --font: "DM Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-display: "DM Serif Display", "PingFang SC", "Hiragino Mincho ProN", serif;
    --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --safe-bottom: env(safe-area-inset-bottom, 16px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .app { max-width: 680px; margin: 0 auto; padding: 20px 16px calc(100px + var(--safe-bottom)); position: relative; z-index: 1; }

  /* ===== HEADER ===== */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 0 16px; margin-bottom: 8px;
    position: sticky; top: 0; z-index: 10;
    background: rgba(250,246,239,0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
    background: var(--accent);
    display: grid; grid-template-columns: 4px 4px 4px; grid-template-rows: 18px 4px 4px;
    gap: 3px; align-content: center; justify-content: center;
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .logo-mark span {
    display: block; border-radius: 1px; background: #faf6ef;
  }
  .logo-mark span:nth-child(1) { grid-row: 1; grid-column: 1; height: 100%; }
  .logo-mark span:nth-child(2) { grid-row: 1 / 3; grid-column: 2; }
  .logo-mark span:nth-child(3) { grid-row: 1 / 4; grid-column: 3; }
  .logo-mark span:nth-child(4) { grid-row: 3; grid-column: 1; }
  .logo-mark span:nth-child(5) { grid-row: 4; grid-column: 1; }
  .header h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.3px; color: var(--text); font-family: var(--font-display); }
  .header sub { font-size: 12px; color: var(--text-dim); font-weight: 400; display: block; margin-top: 1px; }
  .signal-lamp { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--text-faint); transition: background 0.4s, box-shadow 0.4s; }
  .signal-lamp.live { background: var(--cyan); box-shadow: 0 0 10px rgba(77,158,139,0.5); animation: lampPulse 2.5s ease-in-out infinite; }
  @keyframes lampPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .logout-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 8px 12px; border-radius: var(--radius); transition: color 0.2s, background 0.2s; font-family: var(--font); }
  .logout-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .logout-btn:active { color: var(--text); background: var(--surface2); }

  /* ===== ACCOUNT TABS ===== */
  .account-tabs { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0 18px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .account-tabs::-webkit-scrollbar { display: none; }
  .account-tab {
    flex-shrink: 0; padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    transition: border-color 0.25s, background 0.25s, color 0.25s, box-shadow 0.25s; white-space: nowrap; display: flex; align-items: center; gap: 7px;
  }
  .account-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
  .account-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .account-tab:active { transform: scale(0.96); }
  .tab-lamp { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .tab-lamp.on { background: var(--cyan); box-shadow: 0 0 6px rgba(77,158,139,0.4); }
  .tab-lamp.off { background: var(--text-faint); }
  .tab-add {
    flex-shrink: 0; padding: 9px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer;
    background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
    transition: border-color 0.25s, color 0.25s; white-space: nowrap;
  }
  .tab-add:active { border-color: var(--accent); color: var(--accent); }
  .tab-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== SECTION ===== */
  .section { margin-bottom: 32px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-label {
    font-size: 11px; font-weight: 650; text-transform: uppercase;
    letter-spacing: 2px; color: var(--text-faint);
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::before {
    content: ''; display: inline-block; width: 10px; height: 2px;
    background: var(--accent); border-radius: 1px;
  }
  .section-badge {
    font-family: var(--mono); font-size: 12px; color: var(--accent);
    background: var(--accent-dim); padding: 4px 10px; border-radius: 12px; font-weight: 500;
  }

  /* ===== FIELD ===== */
  .field { display: flex; flex-direction: column; gap: 9px; }
  .field-label {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.8px;
    display: flex; align-items: center; gap: 6px;
  }
  .field-label .hint { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--text-faint); }
  .field input, .field textarea {
    font-family: var(--font); font-size: 14px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 12px;
    transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none;
  }
  .field input:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .field input.mono { font-family: var(--mono); font-size: 13px; }
  .field textarea { resize: vertical; min-height: 70px; }
  .form-grid { display: flex; flex-direction: column; gap: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ===== PASSWORD ===== */
  .pw-wrap { position: relative; display: flex; }
  .pw-wrap input { flex: 1; padding-right: 42px; }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; padding: 8px; display: flex; align-items: center;
    transition: color 0.2s;
  }
  .pw-toggle:active { color: var(--accent); }

  /* ===== TAGS ===== */
  .tag-input-wrap {
    display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px; min-height: 44px; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .tag-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-dim); color: var(--accent);
    padding: 4px 9px; border-radius: 4px; font-size: 13px;
    font-family: var(--mono);
  }
  .tag-remove { cursor: pointer; font-size: 18px; line-height: 1; opacity: 0.5; padding: 6px 8px; border: none; background: none; color: inherit; font-family: var(--font); transition: opacity 0.15s; min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; }
  .tag-remove:active { opacity: 1; color: var(--red); }
  .tag-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
  .tag-input {
    border: none; background: transparent; color: var(--text);
    font-family: var(--mono); font-size: 13px;
    flex: 1; min-width: 80px; padding: 4px 6px;
  }
  .tag-input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 2px; }

  /* ===== ROLE GROUP ===== */
  .role-group {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px; margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .role-group:focus-within { border-color: var(--border-hover); }
  .role-group-title {
    font-size: 11px; font-weight: 650; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 1.2px;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 7px;
  }
  .role-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ===== SPEAKER CARD ===== */
  .speaker-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    margin-bottom: 12px; overflow: hidden; transition: border-color 0.25s;
  }
  .speaker-card.expanded { border-color: var(--border-hover); }
  .speaker-card::before {
    content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px;
    border-radius: 0 2px 2px 0; background: transparent; transition: background 0.25s;
  }
  .speaker-card.expanded::before { background: var(--accent); }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 16px; cursor: pointer; position: relative; z-index: 1;
  }
  .speaker-card.expanded .card-header { padding-bottom: 8px; }
  .card-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .card-seq {
    font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent);
    min-width: 30px; letter-spacing: -1px; opacity: 0.7;
  }
  .speaker-card.expanded .card-seq { opacity: 1; }
  .card-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-subtitle { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .card-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .card-badge {
    font-size: 11px; color: var(--text-faint); font-family: var(--mono);
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-arrow {
    font-size: 13px; color: var(--text-faint); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  .speaker-card.expanded .card-arrow { transform: rotate(90deg); }
  .card-body { display: none; padding: 0 16px 16px; position: relative; z-index: 1; }
  .speaker-card.expanded .card-body { display: block; animation: cardIn 0.25s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .card-divider {
    font-size: 11px; font-weight: 650; color: var(--accent); text-transform: uppercase;
    letter-spacing: 1.2px; padding-bottom: 8px; margin-bottom: 2px;
    border-bottom: 1px solid var(--border);
  }
  .inherit-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; padding: 4px 0 8px; }
  .inherit-row input { accent-color: var(--accent); width: 20px; height: 20px; }

  /* ===== SPEAKER STATUS ===== */
  .speaker-status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-faint); transition: background 0.3s, box-shadow 0.3s;
  }
  .speaker-status-dot.running { background: var(--cyan); box-shadow: 0 0 8px rgba(77,158,139,0.4); }
  .speaker-status-dot.stopped { background: var(--red); box-shadow: 0 0 6px rgba(217,74,74,0.4); }
  .speaker-last-seen { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

  /* ===== HEADER MENU ===== */
  .menu-wrap { position: relative; }
  .menu-trigger {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    font-size: 16px; padding: 4px 12px; border-radius: var(--radius); cursor: pointer;
    font-family: var(--font); letter-spacing: 1px; line-height: 1; transition: border-color 0.2s, color 0.2s;
    min-height: 44px; min-width: 44px; display: flex; align-items: center;
  }
  .menu-trigger:active { border-color: var(--accent); color: var(--accent); }
  .menu-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .menu-drop {
    display: none; position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-md); min-width: 140px; z-index: 20; overflow: hidden;
  }
  .menu-drop.show { display: block; animation: cardIn 0.15s ease; }
  .menu-item {
    display: block; width: 100%; text-align: left; padding: 10px 16px;
    background: none; border: none; color: var(--text); font-size: 13px;
    font-family: var(--font); cursor: pointer; transition: background 0.12s; font-size: 14px;
  }
  .menu-item:active { background: var(--surface2); }
  .menu-item-danger { color: var(--red); }
  .menu-item-danger:active { background: var(--red-dim); }

  /* ===== ADD SPEAKER CARD ===== */
  .speaker-add {
    display: block; width: 100%; font-family: var(--font);
    border: 1px dashed var(--border); background: transparent; cursor: pointer;
    border-radius: var(--radius-lg); transition: border-color 0.2s, color 0.2s, background 0.2s; padding: 20px 16px; text-align: center;
    color: var(--text-dim); font-size: 14px; font-weight: 500;
  }
  .speaker-add:active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .speaker-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== BUTTONS ===== */
  .btn {
    font-family: var(--font); font-size: 14px; font-weight: 550; padding: 11px 22px;
    border-radius: 22px; cursor: pointer; border: 1px solid transparent;
    transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; white-space: nowrap; min-height: 44px;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.loading { pointer-events: none; position: relative; color: transparent !important; }
  .btn.loading::after {
    content: ''; position: absolute; width: 18px; height: 18px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 650; }
  .btn-primary:active { background: #b55228; transform: scale(0.97); box-shadow: 0 0 24px var(--accent-glow); }
  .btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); border-radius: var(--radius); }
  .btn-outline:active { border-color: var(--text-dim); background: var(--surface2); }
  .btn-danger { background: transparent; border-color: var(--red); color: var(--red); border-radius: var(--radius); font-size: 13px; padding: 10px 16px; min-height: 44px; }
  .btn-danger:active { background: var(--red-dim); color: var(--red); }
  .btn-danger:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
  .btn-xs { padding: 8px 16px; font-size: 12px; min-height: 44px; border-radius: 14px; }

  /* ===== BOTTOM BAR ===== */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(250,246,239,0.94);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + var(--safe-bottom)); display: flex; gap: 12px;
  }
  #save-btn, #restart-btn { flex: 1; font-size: 15px; position: relative; overflow: hidden; }
  #save-btn::after, #restart-btn::after {
    content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform 0.6s;
  }
  #save-btn:active::after, #restart-btn:active::after { transform: translateX(100%); }
  #restart-btn { background: var(--surface2); border-color: var(--border-hover); color: var(--accent); }
  #restart-btn:active { background: var(--accent-dim); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 24px; border-radius: 20px; font-size: 14px;
    z-index: 100; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== EMPTY STATE ===== */
  .empty {
    text-align: center; padding: 48px 20px; color: var(--text-dim);
    border: 1px dashed var(--border); border-radius: var(--radius-lg);
    font-size: 14px; line-height: 1.8;
  }
  .empty .btn { margin-top: 14px; }

  /* ===== ADD ACCOUNT FORM ===== */
  .add-acct {
    background: var(--surface); border: 1px solid var(--accent-dim); border-radius: var(--radius-lg);
    padding: 20px; margin-bottom: 24px;
  }

  /* ===== ID READONLY ===== */
  .id-readonly {
    font-family: var(--mono); font-size: 13px; color: var(--text-faint);
    padding: 11px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); opacity: 0.8;
  }

  /* ===== LOGIN ===== */
  .login-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 85vh; padding: 20px;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 24px; width: 100%; max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  }
  .login-card .logo-mark { margin: 0 auto 24px; }
  .login-card h2 { text-align: center; font-size: 20px; font-weight: 650; margin-bottom: 22px; letter-spacing: -0.3px; }
  .login-card .field { margin-bottom: 14px; }
  .login-card .btn { width: 100%; margin-top: 8px; }
  .login-hint { text-align: center; font-size: 13px; color: var(--text-dim); margin-top: 16px; }
  .login-hint a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 550; }
  .login-hint a:active { opacity: 0.7; }

  /* ===== SELECT SHEET ===== */
  .sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet-panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 51;
    background: var(--surface); border-radius: 14px 14px 0 0;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 55vh; display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
  }
  .sheet-panel.show { transform: translateY(0); }
  .sheet-title { padding: 16px; text-align: center; font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1.2px; border-bottom: 1px solid var(--border); }
  .sheet-list { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .sheet-option {
    display: block; width: 100%; text-align: left; font-family: var(--font); font-size: 15px;
    padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px;
    border: none; border-bottom: 1px solid var(--border); background: var(--surface); color: var(--text); transition: background 0.15s;
  }
  .sheet-option:active { background: var(--accent-dim); }
  .sheet-option:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sheet-option.selected { color: var(--accent); font-weight: 600; }
  .sheet-option.selected::after { content: '✓'; margin-left: auto; font-size: 14px; }
  .sheet-cancel { display: block; width: 100%; font-family: var(--font); font-size: 15px; padding: 16px; text-align: center; cursor: pointer; font-weight: 600; border: none; border-top: 1px solid var(--border); background: var(--surface); color: var(--text-dim); }
  .sheet-cancel:active { background: var(--surface2); }
  .sheet-cancel:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ===== DEFAULT CONFIG SLAB ===== */
  .defaults-slab {
    border: 1px solid var(--accent-dim); border-radius: var(--radius-lg);
    background: linear-gradient(135deg, rgba(201,98,53,0.04) 0%, transparent 50%);
    padding: 20px 18px; position: relative; overflow: hidden;
  }
  .defaults-slab::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0; opacity: 0.5;
  }
  .defaults-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 2px; color: var(--accent);
    background: var(--accent-dim); padding: 4px 10px; border-radius: 3px;
    border: 1px solid var(--accent-dim);
  }
  .defaults-badge::before {
    content: ''; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }
  .cascade-hint {
    font-size: 11px; color: var(--text-faint); display: flex; align-items: center; gap: 6px;
    margin-bottom: 16px; line-height: 1.6;
  }
  .cascade-hint span { color: var(--accent); font-weight: 600; }

  /* ===== STAGGERED ENTRY ===== */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .stagger { animation: fadeUp 0.4s ease both; }
  .stagger-1 { animation-delay: 0.05s; }
  .stagger-2 { animation-delay: 0.1s; }
  .stagger-3 { animation-delay: 0.15s; }
  .stagger-4 { animation-delay: 0.2s; }
  .stagger-5 { animation-delay: 0.25s; }

  @media (min-width: 600px) {
    .app { padding: 28px 24px calc(100px + var(--safe-bottom)); }
    .form-row { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1814;
      --surface: #25211b;
      --surface2: #2c2822;
      --border: #3a352e;
      --border-hover: #544e44;
      --text: #e8e0d5;
      --text-dim: #b0a595;
      --text-faint: #7a7165;
      --accent: #d47a52;
      --accent-dim: #2d1f17;
      --accent-glow: rgba(212,122,82,0.15);
      --cyan: #5aad96;
      --red: #d47268;
      --red-dim: #2d1a18;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.15);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.2);
    }
    body::before {
      background: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
    }
    .header { background: rgba(27,24,20,0.94); }
    .bottom-bar { background: rgba(27,24,20,0.94); }
    .btn-primary { color: #1b1814; }
    .btn-primary:active { color: #1b1814; }
    .logo-mark span { background: #1b1814; }
    .defaults-slab {
      background: linear-gradient(135deg, rgba(212,122,82,0.08) 0%, transparent 50%);
    }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ====== LOGIN ====== -->
  <div id="view-login" class="login-wrap">
    <div class="login-card">
      <div class="logo-mark">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h2 id="login-title">登录 MiGPT</h2>
      <div class="form-grid">
        <div class="field">
          <label class="field-label" for="login-user">用户名</label>
          <input id="login-user" placeholder="请输入用户名" autocomplete="username" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-label" for="login-pass">密码</label>
          <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="login-submit-btn" onclick="doLogin()">登录</button>
      </div>
      <div class="login-hint">
        <span id="login-switch-text">没有账号？</span>
        <a id="login-switch-link" onclick="toggleLoginMode()">立即注册</a>
      </div>
    </div>
  </div>

  <!-- ====== MAIN ====== -->
  <div id="view-main" style="display:none;">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo-mark">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div>
          <h1>MiGPT</h1>
          <sub id="user-label"></sub>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="signal-lamp" id="conn-dot" title="信号"></span>
        <div class="menu-wrap">
          <button class="menu-trigger" onclick="toggleMenu(event)" aria-label="菜单">···</button>
          <div class="menu-drop" id="menu-drop" onclick="event.stopPropagation()">
            <button class="menu-item" onclick="window.open('/logs','_blank');closeMenu()">日志查看</button>
            <button class="menu-item" onclick="doLogout()">退出登录</button>
            <button class="menu-item menu-item-danger" onclick="deleteMyAccount()">注销账户</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Account Tabs -->
    <div class="account-tabs" id="account-tabs"></div>

    <!-- Config Sections -->
    <div id="config-sections" style="display:none;">
      <!-- Add Account -->
      <div id="add-account-form" style="display:none;" class="add-acct">
        <div class="section-head" style="margin-bottom:16px;">
          <span class="section-label">新增账号</span>
        </div>
        <div class="form-grid">
          <div class="field"><label class="field-label" for="new-userId">用户ID <span class="hint">小米ID</span></label><input id="new-userId" class="mono" placeholder="小米ID，不是小米账号" inputmode="numeric" autocomplete="off" spellcheck="false"><a href="https://account.xiaomi.com/" target="_blank" rel="noopener" style="font-size:10px;color:var(--accent);text-decoration:none;margin-top:2px;display:inline-block;">如何获取小米ID →</a></div>
          <div class="field"><label class="field-label" for="new-password">密码</label><div class="pw-wrap"><input id="new-password" type="password" placeholder="账号密码" autocomplete="new-password"><button class="pw-toggle" onclick="togglePwd('new-password', this)" aria-label="显示密码">&#x1f648;</button></div></div>
          <div class="field"><label class="field-label" for="new-passToken">通行令牌 <span class="hint">可选</span></label><textarea id="new-passToken" class="mono" placeholder="获取后粘贴至此" rows="3" style="resize:vertical;min-height:48px;font-size:12px;word-break:break-all;"></textarea></div>
          <div style="display:flex;gap:8px;"><button class="btn btn-primary" onclick="saveNewAccount()">保存</button><button class="btn btn-outline" onclick="cancelAddAccount()">取消</button></div>
        </div>
      </div>

      <!-- 1. Account Credentials -->
      <div class="section stagger stagger-1">
        <div class="section-head"><span class="section-label">账号凭据</span></div>
        <div class="form-grid">
          <div class="field"><label class="field-label" for="s-userId">用户ID <span class="hint">小米ID</span></label><input id="s-userId" class="mono" placeholder="小米ID，不是小米账号" inputmode="numeric" autocomplete="off" spellcheck="false"><a href="https://account.xiaomi.com/" target="_blank" rel="noopener" style="font-size:10px;color:var(--accent);text-decoration:none;margin-top:2px;display:inline-block;">如何获取小米ID →</a></div>
          <div class="field"><label class="field-label" for="s-password">密码</label><div class="pw-wrap"><input id="s-password" type="password" placeholder="账号密码" autocomplete="current-password"><button class="pw-toggle" id="pw-toggle" onclick="togglePwd('s-password', this)" aria-label="显示密码">&#x1f648;</button></div></div>
          <div class="field"><label class="field-label" for="s-passToken">通行令牌 <span class="hint">Token 登录（优先）</span></label><textarea id="s-passToken" class="mono" placeholder="留空则使用密码登录" rows="3" style="resize:vertical;min-height:48px;font-size:12px;word-break:break-all;"></textarea></div>
        </div>
      </div>

      <!-- 2. Keywords -->
      <div class="section stagger stagger-2">
        <div class="section-head"><span class="section-label">唤醒词 & 提示语</span></div>
        <div class="form-grid">
          <div class="field"><label class="field-label">进入AI对话</label><div class="tag-input-wrap" data-field="callAIKeywords"></div></div>
          <div class="field"><label class="field-label">唤醒词</label><div class="tag-input-wrap" data-field="wakeUpKeywords"></div></div>
          <div class="field"><label class="field-label">退出AI</label><div class="tag-input-wrap" data-field="exitKeywords"></div></div>
          <div class="field"><label class="field-label">切换音箱</label><div class="tag-input-wrap" data-field="switchSpeakerKeywords"></div></div>
          <div class="field"><label class="field-label">进入AI欢迎语</label><div class="tag-input-wrap" data-field="onEnterAI"></div></div>
          <div class="field"><label class="field-label">退出AI提示</label><div class="tag-input-wrap" data-field="onExitAI"></div></div>
          <div class="field"><label class="field-label">AI思考中</label><div class="tag-input-wrap" data-field="onAIAsking"></div></div>
          <div class="field"><label class="field-label">AI回复完毕</label><div class="tag-input-wrap" data-field="onAIReplied"></div></div>
          <div class="field"><label class="field-label">AI出错</label><div class="tag-input-wrap" data-field="onAIError"></div></div>
        </div>
      </div>

      <!-- 3. Default Role Presets (from .migpt.js top-level) -->
      <div class="section stagger stagger-3">
        <div class="section-head">
          <span class="section-label">默认配置</span>
          <span class="defaults-badge">DEFAULT</span>
        </div>
        <div class="cascade-hint">以下配置将作为 <span>所有音箱</span> 的默认值，各音箱可单独覆盖</div>
        <div class="defaults-slab">
          <div class="role-group">
            <div class="role-group-title"><span class="role-dot" style="background:var(--cyan);box-shadow:0 0 6px rgba(77,158,139,0.35);"></span> AI 角色</div>
            <div class="form-grid">
              <div class="field"><label class="field-label">角色名称</label><input id="g-botName" placeholder="给音箱取个好听的名字。如：小美"></div>
              <div class="field"><label class="field-label">角色简介</label><textarea id="g-botProfile" placeholder="音箱扮演的角色简介"></textarea></div>
            </div>
          </div>
          <div class="role-group">
            <div class="role-group-title"><span class="role-dot" style="background:var(--accent);box-shadow:0 0 6px rgba(201,98,53,0.35);"></span> 用户角色</div>
            <div class="form-grid">
              <div class="field"><label class="field-label">用户名称</label><input id="g-masterName" placeholder="你的名字。如：陆小千"></div>
              <div class="field"><label class="field-label">用户简介</label><textarea id="g-masterProfile" placeholder="你的个人简介"></textarea></div>
            </div>
          </div>
          <div class="role-group">
            <div class="role-group-title"><span class="role-dot" style="background:#a090b0;box-shadow:0 0 6px rgba(160,144,176,0.35);"></span> 对话场景</div>
            <div class="form-grid">
              <div class="field"><label class="field-label">房间名称</label><input id="g-roomName" placeholder="音箱所在的房间名称"></div>
              <div class="field"><label class="field-label">房间描述</label><input id="g-roomDescription" placeholder="房间描述。如：客厅里的闲聊，氛围轻松"></div>
            </div>
          </div>
          <div class="role-group">
            <div class="role-group-title"><span class="role-dot" style="background:var(--text-faint);"></span> 系统模板</div>
            <div class="form-grid">
              <div class="field"><label class="field-label">系统模板 <span class="hint">自定义系统提示模板，留空使用默认</span></label><textarea id="g-systemTemplate" placeholder="留空使用默认模板" style="min-height:80px;font-family:var(--mono);font-size:12px;"></textarea></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. Speaker List -->
      <div class="section stagger stagger-4">
        <div class="section-head">
          <span class="section-label">音箱列表</span>
          <span class="section-badge" id="speaker-count">0</span>
        </div>
        <div id="speakers-container"></div>
        <button class="speaker-add" onclick="addSpeaker()">+ 添加音箱</button>
      </div>
    </div>

    <!-- No accounts -->
    <div id="no-accounts" style="display:none;" class="stagger stagger-1">
      <div class="empty">暂无小米账号<br><button class="btn btn-primary" onclick="showAddAccount()" style="margin-top:16px;">+ 添加小米账号</button></div>
    </div>

    <div style="height:20px;"></div>
  </div>
</div>

<div class="bottom-bar" id="bottom-bar" style="display:none;">
  <button class="btn btn-primary" id="save-btn" onclick="save()">保存</button>
  <button class="btn btn-primary" id="restart-btn" onclick="restart()">重启</button>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<!-- Bottom Sheet -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<div class="sheet-panel" id="sheet-panel">
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-list" id="sheet-list"></div>
  <button class="sheet-cancel" onclick="closeSheet()">取消</button>
</div>

</div>

<script>
// ---- State ----
let token = localStorage.getItem("mi_gpt_token") || "";
let loginMode = 'login';
let accounts = [];
let currentAccountId = "";
let shared = {};
let speakers = [];
let globalRole = { botName:'', botProfile:'', masterName:'', masterProfile:'', roomName:'', roomDescription:'', systemTemplate:'' };

// ---- Helpers ----
function $(id) { return document.getElementById(id); }
function qsa(sel,el) { return (el||document).querySelectorAll(sel); }
const API = window.location.origin;

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (token) opts.headers["Authorization"] = `Bearer ${token}`;
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(`${API}${path}`, { ...opts, signal: AbortSignal.timeout(15000) });
  if (r.status === 401) { doLogout(); throw new Error("unauthorized"); }
  return r;
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Connection ----
async function checkConnection() {
  const dot = $('conn-dot');
  try {
    const r = await fetch(`${API}/ping`, { signal: AbortSignal.timeout(3000) });
    dot.className = r.ok ? 'signal-lamp live' : 'signal-lamp';
  } catch (_) { dot.className = 'signal-lamp'; }
}

// ---- View switching ----
function showView(view) {
  $('view-login').style.display = view === 'login' ? '' : 'none';
  $('view-main').style.display = view === 'main' ? '' : 'none';
  $('bottom-bar').style.display = view === 'main' ? '' : 'none';
}

// ---- Login ----
function toggleLoginMode() {
  loginMode = loginMode === 'login' ? 'register' : 'login';
  $('login-title').textContent = loginMode === 'login' ? '登录 MiGPT' : '注册 MiGPT';
  $('login-submit-btn').textContent = loginMode === 'login' ? '登录' : '注册';
  $('login-switch-text').textContent = loginMode === 'login' ? '没有账号？' : '已有账号？';
  $('login-switch-link').textContent = loginMode === 'login' ? '立即注册' : '去登录';
}

async function doLogin() {
  const u = $('login-user').value.trim();
  const p = $('login-pass').value;
  if (!u || !p) { showToast('请输入用户名和密码'); return; }
  const btn = $('login-submit-btn');
  btn.classList.add('loading');
  const path = loginMode === 'login' ? '/api/auth/login' : '/api/auth/register';
  try {
    const r = await fetch(`${API}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
      signal: AbortSignal.timeout(5000),
    });
    const data = await r.json();
    if (!r.ok) { btn.classList.remove('loading'); showToast(data.error || '操作失败'); return; }
    token = data.token;
    localStorage.setItem("mi_gpt_token", token);
    $('user-label').textContent = u;
    showView('main');
    await loadAll();
    refreshStatus();
    statusTimer = setInterval(refreshStatus, 5000);
    checkConnection();
    setInterval(checkConnection, 8000);
  } catch (e) { btn.classList.remove('loading'); showToast('连接失败，请确认服务已启动'); }
}

function doLogout() {
  token = "";
  localStorage.removeItem("mi_gpt_token");
  currentAccountId = "";
  accounts = [];
  speakers = [];
  showView('login');
}

async function deleteMyAccount() {
  if (!confirm('确定注销你的账户吗？所有小米账号、音箱配置和相关数据将被永久删除，不可恢复。')) return;
  try {
    const r = await api('DELETE', '/api/auth/me');
    if (r.ok) { showToast('账户已注销'); doLogout(); }
    else showToast('注销失败');
  } catch (_) { showToast('连接失败'); }
}

// ---- Header Menu ----
function toggleMenu(e) {
  e.stopPropagation();
  $('menu-drop').classList.toggle('show');
}
function closeMenu() {
  $('menu-drop').classList.remove('show');
}
document.addEventListener('click', () => closeMenu());

// ---- Load all config ----
async function loadAll() {
  try {
    const r = await api('GET', '/api/accounts');
    if (!r.ok) return;
    accounts = await r.json();
    renderAccountTabs();

    if (accounts.length > 0) {
      if (!currentAccountId || !accounts.find(a => a.id === currentAccountId)) {
        selectAccount(accounts[0].id);
      } else {
        selectAccount(currentAccountId);
      }
    } else {
      // 新用户：直接展示完整配置页，角色默认值从 .migpt.js 预填充
      currentAccountId = "";
      $('config-sections').style.display = '';
      $('no-accounts').style.display = 'none';
      $('bottom-bar').style.display = '';
      shared = { userId:'', password:'', passToken:'', callAIKeywords:[],wakeUpKeywords:[],exitKeywords:[], switchSpeakerKeywords:[],onEnterAI:[],onExitAI:[], onAIAsking:[],onAIReplied:[],onAIError:[], };
      speakers = [];
      try {
        const r = await fetch(`${API}/api/defaults`, { signal: AbortSignal.timeout(5000) });
        if (r.ok) {
          const defaults = await r.json();
          if (defaults.botName || defaults.botProfile || defaults.masterName || defaults.masterProfile) {
            globalRole = {
              botName: defaults.botName || '', botProfile: defaults.botProfile || '',
              masterName: defaults.masterName || '', masterProfile: defaults.masterProfile || '',
              roomName: defaults.roomName || '', roomDescription: defaults.roomDescription || '',
              systemTemplate: defaults.systemTemplate || '',
            };
          }
          // 关键词也从 .migpt.js 预填充
          const kwKeys = ['callAIKeywords','wakeUpKeywords','exitKeywords','switchSpeakerKeywords','onEnterAI','onExitAI','onAIAsking','onAIReplied','onAIError'];
          for (const k of kwKeys) {
            if (defaults[k]?.length) shared[k] = defaults[k];
          }
        }
      } catch (_) {}
      syncUI();
    }
  } catch (_) {}
}

// ---- Account Tabs ----
function renderAccountTabs() {
  const container = $('account-tabs');
  let html = '';
  accounts.forEach((a) => {
    const active = a.id === currentAccountId ? ' active' : '';
    html += `<div class="account-tab${active}" data-account="${a.id}" onclick="selectAccount('${a.id}')">
      <span class="tab-lamp ${a.status === 'running' ? 'on' : 'off'}"></span>
      ${esc(a.userId)}
    </div>`;
  });
  container.innerHTML = html;
}

async function selectAccount(accountId) {
  currentAccountId = accountId;
  const account = accounts.find(a => a.id === accountId);
  if (!account) return;

  qsa('.account-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.account === accountId);
  });

  $('add-account-form').style.display = 'none';
  $('config-sections').style.display = '';
  $('no-accounts').style.display = 'none';
  $('bottom-bar').style.display = '';

  shared = {
    userId:account.userId||'', password:account.password||'', passToken:account.passToken||'',
    callAIKeywords:[],wakeUpKeywords:[],exitKeywords:[],
    switchSpeakerKeywords:[],onEnterAI:[],onExitAI:[],
    onAIAsking:[],onAIReplied:[],onAIError:[],
  };
  try {
    const defaults = JSON.parse(account.speakerDefaults || '{}');
    for (const k of Object.keys(shared)) {
      if (defaults[k]?.length) shared[k] = defaults[k];
    }
    globalRole = {
      botName: defaults.botName || '',
      botProfile: defaults.botProfile || '',
      masterName: defaults.masterName || '',
      masterProfile: defaults.masterProfile || '',
      roomName: defaults.roomName || '',
      roomDescription: defaults.roomDescription || '',
      systemTemplate: defaults.systemTemplate || '',
    };
  } catch (_) {}

  // 如果角色默认为空，从 .migpt.js 预填充
  const roleEmpty = !globalRole.botName && !globalRole.botProfile && !globalRole.masterName && !globalRole.masterProfile && !globalRole.roomName && !globalRole.roomDescription && !globalRole.systemTemplate;
  const kwEmpty = !shared.callAIKeywords?.length && !shared.wakeUpKeywords?.length && !shared.exitKeywords?.length;
  if (roleEmpty || kwEmpty) {
    try {
      const r = await fetch(`${API}/api/defaults`, { signal: AbortSignal.timeout(5000) });
      if (r.ok) {
        const defaults = await r.json();
        if (roleEmpty && (defaults.botName || defaults.botProfile || defaults.masterName || defaults.masterProfile)) {
          globalRole = {
            botName: defaults.botName || '',
            botProfile: defaults.botProfile || '',
            masterName: defaults.masterName || '',
            masterProfile: defaults.masterProfile || '',
            roomName: defaults.roomName || '',
            roomDescription: defaults.roomDescription || '',
            systemTemplate: defaults.systemTemplate || '',
          };
        }
        if (kwEmpty) {
          const kwKeys = ['callAIKeywords','wakeUpKeywords','exitKeywords','switchSpeakerKeywords','onEnterAI','onExitAI','onAIAsking','onAIReplied','onAIError'];
          for (const k of kwKeys) {
            if (defaults[k]?.length) shared[k] = defaults[k];
          }
        }
      }
    } catch (_) {}
  }

  speakers = (account.speakers || []).map(s => {
    let cfg = {};
    try { cfg = JSON.parse(s.config || '{}'); } catch (_) {}
    return {
      id:s.id, did:s.did||'', model:s.model||'', modelName:s.modelName||'',
      ttsCommand:cfg.ttsCommand||[5,1], wakeUpCommand:cfg.wakeUpCommand||[5,3],
      tts:cfg.tts||'xiaoai', streamResponse:cfg.streamResponse??false,
      bot:{name:cfg.botName||'',profile:cfg.botProfile||''},
      master:{name:cfg.masterName||'',profile:cfg.masterProfile||''},
      room:{name:cfg.roomName||'',description:cfg.roomDescription||''},
      systemTemplate:cfg.systemTemplate||'',
    };
  });
  syncUI();
  clearDirty();
}

// ---- Tag Input ----
function initTagInputs() {
  qsa('.tag-input-wrap').forEach(wrap => {
    const field = wrap.dataset.field;
    wrap.innerHTML = '';
    const vals = shared[field] || [];
    vals.forEach(v => { if (v) addTag(wrap, v); });
    const input = document.createElement('input');
    input.className = 'tag-input';
    input.placeholder = '输入后回车';
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && input.value.trim()) {
        e.preventDefault();
        addTag(wrap, input.value.trim());
        input.value = '';
        syncTags(wrap);
      }
      if (e.key === 'Backspace' && !input.value && wrap.querySelectorAll('.tag').length) {
        wrap.querySelector('.tag:last-of-type').remove();
        syncTags(wrap);
      }
    });
    wrap.addEventListener('click', () => input.focus());
    wrap.appendChild(input);
  });
}

function addTag(wrap, text) {
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = text;
  const rm = document.createElement('button');
  rm.className = 'tag-remove';
  rm.setAttribute('aria-label', '移除标签');
  rm.textContent = '×';
  rm.addEventListener('click', e => { e.stopPropagation(); tag.remove(); syncTags(wrap); });
  tag.appendChild(rm);
  wrap.insertBefore(tag, wrap.querySelector('.tag-input'));
}

function syncTags(wrap) {
  const field = wrap.dataset.field;
  const vals = [...wrap.querySelectorAll('.tag')].map(t => t.childNodes[0].textContent.trim());
  shared[field] = vals;
}

function collectShared() {
  shared.userId = $('s-userId').value;
  shared.password = $('s-password').value;
  shared.passToken = $('s-passToken').value;
  qsa('.tag-input-wrap').forEach(w => syncTags(w));

  globalRole.botName = $('g-botName').value.trim();
  globalRole.botProfile = $('g-botProfile').value.trim();
  globalRole.masterName = $('g-masterName').value.trim();
  globalRole.masterProfile = $('g-masterProfile').value.trim();
  globalRole.roomName = $('g-roomName').value.trim();
  globalRole.roomDescription = $('g-roomDescription').value.trim();
  globalRole.systemTemplate = $('g-systemTemplate').value.trim();
}

// ---- Custom Select ----
function initCustomSelects() {
  qsa('.c-select').forEach(el => el.remove());
  qsa('select[data-speaker]').forEach(nativeSelect => {
    const wrap = document.createElement('div');
    wrap.className = 'c-select'; wrap.setAttribute('data-speaker', nativeSelect.dataset.speaker); wrap.setAttribute('data-key', nativeSelect.dataset.key);
    nativeSelect.style.display = 'none';
    nativeSelect.parentNode.insertBefore(wrap, nativeSelect);
    const trigger = document.createElement('div');
    trigger.className = 'c-select-trigger';
    trigger.style.cssText = 'display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;cursor:pointer;min-height:44px;transition:border-color 0.15s;';
    const selOpt = nativeSelect.options[nativeSelect.selectedIndex];
    trigger.innerHTML = `<span style="font-size:14px;">${selOpt?selOpt.text:''}</span><span style="font-size:12px;color:var(--text-faint);">▾</span>`;
    trigger.addEventListener('click', () => { _activeSelect = nativeSelect; openSheet(nativeSelect, trigger); });
    wrap.appendChild(trigger);
  });
}

let _activeSelect = null;

function openSheet(nativeSelect, trigger) {
  const key = nativeSelect.dataset.key;
  $('sheet-title').textContent = key === 'model' ? '选择音箱型号' : '选择 TTS 引擎';
  const list = $('sheet-list');
  list.innerHTML = '';
  [...nativeSelect.options].forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'sheet-option' + (opt.selected ? ' selected' : '');
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      nativeSelect.value = opt.value;
      nativeSelect.dispatchEvent(new Event('change'));
      trigger.querySelector('span').textContent = opt.text;
      closeSheet();
    });
    list.appendChild(btn);
  });
  $('sheet-backdrop').classList.add('show');
  $('sheet-panel').classList.add('show');
}

function closeSheet() {
  $('sheet-backdrop').classList.remove('show');
  $('sheet-panel').classList.remove('show');
  _activeSelect = null;
}

function renderSpeakers() {
  const container = $('speakers-container');
  container.innerHTML = '';
  speakers.forEach((sp, i) => container.appendChild(buildSpeakerCard(sp, i)));
  $('speaker-count').textContent = speakers.length;
  initCustomSelects();
}

function toggleRoleOverride(index) {
  const cb = document.querySelector(`input[type="checkbox"][data-speaker="${index}"][data-key="inheritRole"]`);
  const overrideDiv = document.querySelector(`.role-override[data-speaker="${index}"]`);
  if (overrideDiv) overrideDiv.style.display = cb.checked ? 'none' : '';
}

function onModelChange(index) {
  const select = document.querySelector(`select[data-speaker="${index}"][data-key="model"]`);
  const model = select?.value;
  const info = MODEL_DATA[model];
  if (!info) return;
  const ttsEl = document.querySelector(`input[type="hidden"][data-speaker="${index}"][data-key="ttsCommand"]`);
  if (ttsEl) ttsEl.value = info.ttsCommand.join(',');
  const wakeEl = document.querySelector(`input[type="hidden"][data-speaker="${index}"][data-key="wakeUpCommand"]`);
  if (wakeEl) wakeEl.value = info.wakeUpCommand.join(',');
  const streamEl = document.querySelector(`input[type="hidden"][data-speaker="${index}"][data-key="streamResponse"]`);
  if (streamEl) streamEl.value = info.streamResponse ? 'true' : 'false';
  const nameEl = document.querySelector(`input[type="hidden"][data-speaker="${index}"][data-key="modelName"]`);
  if (nameEl) nameEl.value = info.name;
}

function collectSpeaker(index) {
  const sp = { ...speakers[index] };
  qsa(`[data-speaker="${index}"]`).forEach(el => {
    const key = el.dataset.key;
    if (key === 'inheritRole') return;
    let val;
    if (el.tagName === 'SELECT') { val = el.value; }
    else if (key === 'streamResponse') { val = el.value === 'true'; }
    else if (key === 'ttsCommand' || key === 'wakeUpCommand') { val = el.value.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)); }
    else { val = el.value; }
    if (key === 'botName') { sp.bot = { ...sp.bot, name: val }; }
    else if (key === 'botProfile') { sp.bot = { ...sp.bot, profile: val }; }
    else if (key === 'masterName') { sp.master = { ...sp.master, name: val }; }
    else if (key === 'masterProfile') { sp.master = { ...sp.master, profile: val }; }
    else if (key === 'roomName') { sp.room = { ...sp.room, name: val }; }
    else if (key === 'roomDescription') { sp.room = { ...sp.room, description: val }; }
    else if (key === 'systemTemplate') { sp.systemTemplate = val; }
    else { sp[key] = val; }
  });

  const inheritCb = document.querySelector(`input[type="checkbox"][data-speaker="${index}"][data-key="inheritRole"]`);
  if (inheritCb && inheritCb.checked) {
    sp.bot = { name: globalRole.botName, profile: globalRole.botProfile };
    sp.master = { name: globalRole.masterName, profile: globalRole.masterProfile };
    sp.room = { name: globalRole.roomName, description: globalRole.roomDescription };
    sp.systemTemplate = globalRole.systemTemplate;
  }
  return sp;
}

function syncAllSpeakers() { speakers = speakers.map((_,i) => collectSpeaker(i)); }

function addSpeaker() {
  syncAllSpeakers();
  speakers.push({ id:'', did:'', model:'', modelName:'', ttsCommand:[5,1], wakeUpCommand:[5,3], tts:'xiaoai', streamResponse:false, bot:{name:'',profile:''}, master:{name:'',profile:''}, room:{name:'',description:''}, systemTemplate:'' });

function removeSpeaker(index) {

// ---- Save & Restart ----
function buildSpeakerDefaults() {
  const kwKeys = ['callAIKeywords','wakeUpKeywords','exitKeywords','switchSpeakerKeywords','onEnterAI','onExitAI','onAIAsking','onAIReplied','onAIError'];
  const speakerDefaults = {};
  for (const k of kwKeys) { speakerDefaults[k] = shared[k] || []; }
  speakerDefaults.botName = globalRole.botName;
  speakerDefaults.botProfile = globalRole.botProfile;
  speakerDefaults.masterName = globalRole.masterName;
  speakerDefaults.masterProfile = globalRole.masterProfile;
  speakerDefaults.roomName = globalRole.roomName;
  speakerDefaults.roomDescription = globalRole.roomDescription;
  speakerDefaults.systemTemplate = globalRole.systemTemplate;
  return speakerDefaults;
}

async function save() {
  collectShared();
  syncAllSpeakers();

  if (!currentAccountId && !shared.userId) { showToast('请先填写小米账号 userId'); return; }

  const btn = $('save-btn');
  btn.classList.add('loading');

  speakers = speakers.map(sp => {
    if (!sp.bot?.name && !sp.bot?.profile && !sp.master?.name && !sp.master?.profile && !sp.room?.name && !sp.room?.description && !sp.systemTemplate) {
      return { ...sp, bot:{name:globalRole.botName,profile:globalRole.botProfile}, master:{name:globalRole.masterName,profile:globalRole.masterProfile}, room:{name:globalRole.roomName,description:globalRole.roomDescription}, systemTemplate:globalRole.systemTemplate };
    }
    return sp;
  });

  const speakerDefaults = buildSpeakerDefaults();

  if (!currentAccountId) {
    try {
      const r = await api('POST', '/api/accounts', {
        userId: shared.userId, password: shared.password, passToken: shared.passToken, speakerDefaults,
      });
      if (!r.ok) { const d = await r.json(); btn.classList.remove('loading'); showToast(d.error || '创建账号失败'); return; }
      const account = await r.json();
      currentAccountId = account.id;
      const accR = await api('GET', '/api/accounts');
      if (accR.ok) { accounts = await accR.json(); renderAccountTabs(); }
    } catch (_) { btn.classList.remove('loading'); showToast('连接失败'); return; }
  } else {
    try {
      const r = await api('PUT', `/api/accounts/${currentAccountId}`, {
        userId: shared.userId, password: shared.password, passToken: shared.passToken, speakerDefaults,
      });
      if (!r.ok) { const d = await r.json(); btn.classList.remove('loading'); showToast(d.error || '更新账号失败'); return; }
    } catch (_) { btn.classList.remove('loading'); showToast('连接失败'); return; }
  }

  let existingSpeakers = [];
  try {
    const r = await api('GET', `/api/accounts/${currentAccountId}/speakers`);
    const data = await r.json();
    existingSpeakers = data.speakers || [];
  } catch (_) {}

  const existingIds = new Set(existingSpeakers.map(s => s.id));
  const updatedIds = new Set();

  for (const sp of speakers) {
    const speakerData = {
      did: sp.did, model: sp.model, modelName: sp.modelName,
      config: {
        ttsCommand: sp.ttsCommand, wakeUpCommand: sp.wakeUpCommand,
        tts: sp.tts, streamResponse: sp.streamResponse,
        botName: sp.bot?.name || '', botProfile: sp.bot?.profile || '',
        masterName: sp.master?.name || '', masterProfile: sp.master?.profile || '',
        roomName: sp.room?.name || '', roomDescription: sp.room?.description || '',
        systemTemplate: sp.systemTemplate || '',
      },
    };

    if (sp.id && existingIds.has(sp.id)) {
      updatedIds.add(sp.id);
      await api('PUT', `/api/accounts/${currentAccountId}/speakers/${sp.id}`, speakerData);
    } else {
      const r = await api('POST', `/api/accounts/${currentAccountId}/speakers`, speakerData);
      if (r.ok) { const created = await r.json(); updatedIds.add(created.id); }
    }
  }

  for (const es of existingSpeakers) {
    if (!updatedIds.has(es.id)) {
      await api('DELETE', `/api/accounts/${currentAccountId}/speakers/${es.id}`);
    }
  }

  clearDirty();
  btn.classList.remove('loading');
  showToast('已保存');
}

async function restart() {
  if (!currentAccountId) { showToast('请先保存后再重启'); return; }
  const btn = $('restart-btn');
  btn.classList.add('loading');
  const accR = await api('GET', '/api/accounts');
  if (accR.ok) { accounts = await accR.json(); renderAccountTabs(); }
  await selectAccount(currentAccountId);
  try {
    const r = await api('POST', `/api/accounts/${currentAccountId}/restart`);
    btn.classList.remove('loading');
    if (r.ok) { showToast('已重启'); await refreshStatus(); }
    else showToast('重启失败');
  } catch (_) { btn.classList.remove('loading'); showToast('重启失败，请检查服务状态'); }
}

// ---- Status refresh ----
let accountStatuses = {};
let statusTimer = 0;

async function refreshStatus() {
  if (!token) return;
  try {
    const r = await api('GET', '/api/accounts');
    if (!r.ok) return;
    accounts = await r.json();
    // 获取每个账号的详细状态
    for (const a of accounts) {
      try {
        const sr = await api('GET', `/api/accounts/${a.id}/status`);
        if (sr.ok) accountStatuses[a.id] = await sr.json();
      } catch (_) {}
    }
    renderAccountTabs();
    updateSpeakerCardsStatus();
  } catch (_) {}
}

function updateSpeakerCardsStatus() {
  if (!currentAccountId) return;
  const status = accountStatuses[currentAccountId];
  const speakers = status?.speakers || [];
  const cards = qsa('.speaker-card');
  cards.forEach(card => {
    const did = card.querySelector('[data-key="did"]')?.value;
    const spStatus = speakers.find(s => s.did === did);
    const dot = card.querySelector('.speaker-status-dot');
    const seen = card.querySelector('.speaker-last-seen');
    if (dot && spStatus) {
      dot.className = 'speaker-status-dot ' + spStatus.status;
      dot.title = spStatus.miServicesReady ? '已连接' : '未连接';
    }
    if (seen && spStatus && spStatus.lastAIResponseTime) {
      const ago = Math.round((Date.now() - spStatus.lastAIResponseTime) / 1000);
      seen.textContent = ago < 120 ? `最近响应: ${ago}秒前` : `最近响应: ${Math.round(ago/60)}分钟前`;
    }
  });
}

// ---- Unsaved changes ----
let _dirty = false;
function markDirty() { _dirty = true; }
function clearDirty() { _dirty = false; }
window.addEventListener('beforeunload', e => { if (_dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('input', e => { if (e.target.closest('#view-main')) markDirty(); });
document.addEventListener('change', e => { if (e.target.closest('#view-main')) markDirty(); });

// ---- Init ----
async function init() {
  if (token) {
    try {
      const r = await api('GET', '/api/me');
      if (r.ok) {
        const data = await r.json();
        $('user-label').textContent = data.username || '';
        showView('main');
        await loadAll();
        if (statusTimer) clearInterval(statusTimer);
        await refreshStatus();
        statusTimer = setInterval(refreshStatus, 5000);
        checkConnection();
        setInterval(checkConnection, 8000);
      } else { doLogout(); }
    } catch (_) { doLogout(); }
  } else {
    showView('login');
  }
  $('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
init();
</script>
